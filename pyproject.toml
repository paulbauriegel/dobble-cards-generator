[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dobble-generator"
version = "0.1.0"
description = "Generate printable Dobble (Spot It) decks from any set of symbol images"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "reportlab>=4",
]

[project.scripts]
dobble = "dobble.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
generate = [
    "openai>=2",
]

[tool.setuptools]
packages = ["dobble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
